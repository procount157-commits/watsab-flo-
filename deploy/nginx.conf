# Serves the built frontend and proxies /api to the api container.
# The app calls same-origin /api paths, so both must sit behind one hostname.

upstream wam_api { server api:8080; }

# Who gets the generated, text-only home page at /: search engines and link
# previews, which read HTML and not a JavaScript app. People — signed in or
# not — get the designed landing page (the app shell, which shows the landing
# to visitors and the dashboard to users).
map $http_user_agent $wam_crawler {
    default 0;
    "~*(googlebot|bingbot|yandex|baiduspider|duckduckbot|slurp|applebot|facebookexternalhit|facebot|twitterbot|linkedinbot|whatsapp|telegrambot|slackbot|discordbot|petalbot|semrush|ahrefs)" 1;
}

server {
    listen 80;
    server_name _;

    # Let certbot answer its challenge before TLS exists.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    # Once a certificate is issued, uncomment to force HTTPS.
    # location / { return 301 https://$host$request_uri; }

    include /etc/nginx/conf.d/app.locations;
}

