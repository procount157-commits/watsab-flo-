<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>FLOW HUB™ — WhatsApp Marketing Platform</title>
    <meta name="description" content="FLOW HUB™ — a professional platform for bulk WhatsApp messaging and campaign and contact management, with an AI sales team that replies and follows up. Made for restaurants, gold and jewelry shops, barbershops and beauty centers." />
    <meta name="robots" content="index, follow" />
    <!-- The page at "/" is the marketing landing: English unless the visitor
         chose Arabic there. Every other path is the Arabic app. React keeps
         lang/dir/title in step afterwards (LandingPage.tsx, App.tsx); this only
         sets them before the first paint. -->
    <script>
      (function () {
        var ar = location.pathname.replace(/\/+$/, "") !== "";
        if (!ar) { try { ar = localStorage.getItem("flowhub-landing-lang") === "ar"; } catch (e) {} }
        if (ar) {
          var h = document.documentElement;
          h.lang = "ar"; h.dir = "rtl";
          document.title = "FLOW HUB™ — منصة الإرسال عبر واتساب";
        }
      })();
    </script>
    <meta property="og:title" content="FLOW HUB™ — The Professional WhatsApp Platform" />
    <meta property="og:description" content="Send thousands of WhatsApp messages professionally. Manage campaigns and customers from one platform." />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ar_AE" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FLOW HUB™" />
    <meta name="twitter:description" content="Smart WhatsApp messaging platform" />
    <!-- أيقونة التبويب. السطر الواحد الذي كان هنا (SVG وحده) يكفي كروم
         وحده: سفاري لا يقرأ SVG للتبويب، وكل متصفحٍ يطلب /favicon.ico
         من جذر الموقع مهما كُتب هنا — وذاك كان يسقط إلى صفحة التطبيق
         فيرجع HTML برمز 200، فيرى المتصفح «أيقونة» ليست صورة ويعرض
         بديله. ولذلك ملفٌّ حقيقي بكل المقاسات، ورقم نسخةٍ يكسر الذاكرة:
         أيقونات المتصفحات تُخزَّن بعناد ولا تتحدّث بإعادة التحميل. -->
    <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/site.webmanifest?v=2" />
    <meta name="theme-color" content="#0E1F18" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
